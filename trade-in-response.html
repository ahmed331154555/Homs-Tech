<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Bevestiging inruilwaarde | HOMS TECH</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#172b43;background:#f3f6fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}
    .card{width:min(100%,520px);background:#fff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px #0f172a12}
    header{background:#071d2d;color:#fff;padding:22px 26px;font-size:22px;font-weight:800}header span{color:#60a5fa}
    main{padding:28px}h1{font-size:24px;margin:0 0 12px}p{line-height:1.65;color:#64748b}
    .actions{display:grid;gap:12px;margin-top:24px}.btn{border:0;border-radius:11px;padding:15px 18px;font-size:16px;font-weight:800;cursor:pointer}
    .accept{background:#16a34a;color:#fff}.reject{background:#fff;color:#b91c1c;border:1px solid #fecaca}
    .status{padding:14px;border-radius:11px;background:#eff6ff;color:#1e3a5f;line-height:1.55}
    .status.error{background:#fff1f2;color:#9f1239}.status.success{background:#ecfdf3;color:#166534}
    .muted{font-size:12px;color:#94a3b8;margin-top:22px}
    button:disabled{opacity:.6;cursor:wait}
  </style>
</head>
<body>
  <section class="card">
    <header>HOMS <span>TECH</span></header>
    <main>
      <h1>Uw inruil bevestigen</h1>
      <p id="intro">U kunt hieronder aangeven of u akkoord gaat met de definitieve inruilwaarde van uw oude iPhone.</p>
      <div id="status" class="status" role="status">Kies akkoord of niet akkoord.</div>
      <div class="actions" id="actions">
        <button class="btn accept" id="accept">✓ Akkoord met de inruilwaarde</button>
        <button class="btn reject" id="reject">Niet akkoord</button>
      </div>
      <p class="muted">Uw keuze wordt veilig aan HOMS TECH doorgegeven. Heeft u vragen? Neem contact met ons op.</p>
    </main>
  </section>
  <script>
    (function(){
      const params=new URLSearchParams(window.location.search);
      const token=params.get("token")||"";
      const status=document.getElementById("status");
      const actions=document.getElementById("actions");
      const buttons=[document.getElementById("accept"),document.getElementById("reject")];
      function show(message,type){status.textContent=message;status.className="status"+(type?" "+type:"");}
      async function decide(decision){
        if(!/^[a-f0-9]{64}$/i.test(token)){show("Deze link is ongeldig. Neem contact op met HOMS TECH.","error");actions.hidden=true;return;}
        buttons.forEach(button=>button.disabled=true);
        show("Uw keuze wordt veilig opgeslagen...");
        try{
          const response=await fetch("/api/trade-in/decision",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({token,decision})});
          const result=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(result.error||"Uw keuze kon niet worden opgeslagen.");
          actions.hidden=true;
          if(decision==="accept"){document.getElementById("intro").textContent="Bedankt voor uw akkoord. HOMS TECH heeft uw bevestiging ontvangen en verwerkt de uitbetaling van de definitieve inruilwaarde.";show("✓ U bent akkoord gegaan met de definitieve inruilwaarde.","success");}
          else{document.getElementById("intro").textContent="Bedankt voor uw reactie. HOMS TECH neemt contact met u op over het terugsturen van uw oude iPhone.";show("Uw afwijzing is ontvangen. Er wordt geen bedrag uitbetaald.","success");}
        }catch(error){show(error.message,"error");buttons.forEach(button=>button.disabled=false);}
      }
      buttons[0].addEventListener("click",()=>decide("accept"));
      buttons[1].addEventListener("click",()=>decide("reject"));
      if(!token){actions.hidden=true;show("Deze bevestigingslink is ongeldig of onvolledig.","error");}
    })();
  </script>
</body>
</html>
