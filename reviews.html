<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klantbeoordelingen · HOMS TECH</title>
<style>:root{font-family:Inter,Arial,sans-serif;color:#172b43;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}.hero{background:#071d2d;color:#fff;padding:48px 20px;text-align:center}.hero h1{font-size:clamp(28px,5vw,42px);margin:0 0 10px}.hero p{color:#d5e2ef}.score{font-size:34px;font-weight:800;color:#93c5fd}.wrap{max-width:1000px;margin:28px auto;padding:0 18px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filters button{padding:9px 14px;border:1px solid #d5dfeb;background:#fff;border-radius:999px;cursor:pointer}.filters button.active{background:#2563eb;color:#fff}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px}.stars{color:#e3a008;letter-spacing:2px}.meta{font-size:13px;color:#64748b;margin:7px 0}.card p{line-height:1.65;white-space:pre-wrap}.reply{margin-top:12px;padding:12px;background:#f1f6fc;border-radius:10px}.empty{text-align:center;color:#64748b;padding:30px}.brand{font-weight:800;letter-spacing:.05em}.brand span{color:#60a5fa}</style></head>
<body><header class="hero"><div class="brand">HOMS <span>TECH</span></div><h1>Ervaringen van onze klanten</h1><p>Echte beoordelingen van klanten die HOMS TECH hebben gebruikt.</p><div class="score" id="score">—</div><div id="count">Beoordelingen laden…</div></header>
<main class="wrap"><div class="filters"><button class="active" data-type="all">Alle</button><button data-type="repair">Reparaties</button><button data-type="buy">Aankopen</button><button data-type="sell">Verkoop aan ons</button></div><section id="list" class="list"><div class="empty">Beoordelingen laden…</div></section></main>
<script>
let type="all";const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){try{const r=await fetch("/api/reviews"+(type==="all"?"":"?type="+type));const d=await r.json();if(!r.ok)throw new Error(d.error);document.getElementById("score").textContent=Number(d.summary.average).toFixed(1)+"/5 ★";document.getElementById("count").textContent=d.summary.count+" gepubliceerde beoordelingen";document.getElementById("list").innerHTML=d.reviews.length?d.reviews.map(x=>'<article class="card"><div class="stars">'+("★".repeat(x.rating))+("☆".repeat(5-x.rating))+'</div><h3>'+esc(x.title||"Beoordeling")+'</h3><div class="meta">'+esc(x.customer_name)+' · '+esc(({repair:"Reparatie",buy:"Aankoop",sell:"Verkoop"}[x.order_type]||"Klant"))+'</div><p>'+esc(x.body)+'</p>'+(x.admin_reply?'<div class="reply"><strong>Reactie HOMS TECH</strong><p>'+esc(x.admin_reply)+'</p></div>':'')+'</article>').join(""):'<div class="empty">Er zijn nog geen beoordelingen in deze categorie.</div>';}catch(e){document.getElementById("list").innerHTML='<div class="empty">Beoordelingen konden niet worden geladen.</div>';}}
document.querySelector(".filters").addEventListener("click",e=>{const b=e.target.closest("button[data-type]");if(!b)return;type=b.dataset.type;document.querySelectorAll("[data-type]").forEach(x=>x.classList.toggle("active",x===b));load();});load();
</script></body></html>
