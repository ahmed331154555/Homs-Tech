<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deel uw ervaring · HOMS TECH</title>
<style>:root{font-family:Inter,Arial,sans-serif;color:#172b43;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:100%;max-width:620px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 16px 45px #0b22351a}.brand{font-weight:850;color:#071d2d;letter-spacing:.05em}.brand span{color:#2563eb}h1{margin:18px 0 8px}.muted{color:#64748b;line-height:1.6}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:700}.field input,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit}.field textarea{min-height:130px;resize:vertical}.stars{display:flex;gap:8px}.stars button{font-size:32px;border:0;background:none;color:#cbd5e1;cursor:pointer;padding:0}.stars button.selected{color:#e3a008}.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;margin:12px 0}.consent input{margin-top:3px}.submit{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#174b85;margin:12px 0}.notice.error{background:#fff1f2;color:#9f1239}</style></head>
<body><main class="card"><div class="brand">HOMS <span>TECH</span></div><h1>Hoe was uw ervaring?</h1><p class="muted">We waarderen uw feedback. Uw beoordeling helpt andere klanten bij hun keuze.</p><div id="notice" class="notice" hidden></div>
<form id="form"><div class="field"><label>Uw beoordeling</label><div class="stars" id="stars" role="group" aria-label="Kies 1 tot 5 sterren"><button type="button" data-rating="1" aria-label="1 ster">★</button><button type="button" data-rating="2" aria-label="2 sterren">★</button><button type="button" data-rating="3" aria-label="3 sterren">★</button><button type="button" data-rating="4" aria-label="4 sterren">★</button><button type="button" data-rating="5" aria-label="5 sterren">★</button></div></div>
<div class="field"><label for="name">Uw volledige naam</label><input id="name" maxlength="120" required autocomplete="name"></div><div class="field"><label for="title">Titel (optioneel)</label><input id="title" maxlength="120" placeholder="Bijvoorbeeld: Snelle en goede service"></div><div class="field"><label for="body">Uw ervaring</label><textarea id="body" minlength="10" maxlength="3000" required placeholder="Vertel kort over uw ervaring met HOMS TECH…"></textarea></div>
<label class="consent"><input id="nameConsent" type="checkbox" required><span>Ik geef toestemming om mijn volledige naam openbaar bij mijn beoordeling te tonen.</span></label><label class="consent"><input id="reviewConsent" type="checkbox" required><span>Ik geef toestemming om mijn beoordeling openbaar te publiceren. Ik begrijp dat mijn beoordeling na verzending niet meer door mij kan worden aangepast.</span></label>
<button class="submit" type="submit">Verstuur beoordeling</button></form></main>
<script>
const token=new URLSearchParams(location.search).get("token")||"";let rating=0;const notice=document.getElementById("notice");function show(text,error=false){notice.hidden=false;notice.textContent=text;notice.classList.toggle("error",error);}
document.getElementById("stars").addEventListener("click",e=>{const b=e.target.closest("button[data-rating]");if(!b)return;rating=Number(b.dataset.rating);document.querySelectorAll("#stars button").forEach(x=>x.classList.toggle("selected",Number(x.dataset.rating)<=rating));});
(async()=>{if(!/^[a-f0-9]{64}$/i.test(token)){document.getElementById("form").hidden=true;show("Deze beoordelingslink is ongeldig.",true);return;}try{const r=await fetch("/api/reviews/invite/"+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.error); }catch(e){document.getElementById("form").hidden=true;show(e.message,true);}})();
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();if(!rating){show("Kies eerst het aantal sterren.",true);return;}const button=e.target.querySelector("button[type=submit]");button.disabled=true;button.textContent="Verzenden…";try{const r=await fetch("/api/reviews/invite/"+encodeURIComponent(token),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rating,customerName:document.getElementById("name").value,title:document.getElementById("title").value,body:document.getElementById("body").value,displayNameConsent:document.getElementById("nameConsent").checked,reviewConsent:document.getElementById("reviewConsent").checked})});const d=await r.json();if(!r.ok)throw new Error(d.error);e.target.hidden=true;show(d.message);}catch(err){show(err.message,true);button.disabled=false;button.textContent="Verstuur beoordeling";}});
</script></body></html>
