<script>

const KEY = "homsTechData";


const defaults = {

  businessName:"HOMS TECH",

  tagline:"Telefoonreparatie bij jou aan de deur",

  heroTitle:"Telefoon kapot? Wij komen naar jou! 🚗📱",

  heroText:
    "Reparatie van alle soorten telefoons bij jou aan de deur — snelle service, netjes werk en betaalbare prijzen.",

  whatsapp:"31612345678",

  phone:"+31 6 12345678",

  areas:"Rotterdam en omgeving",

  services:[
    ["🖥️","Scherm vervangen","Gebroken of defect scherm?"],
    ["🔋","Batterij vervangen","Batterij snel leeg of zwak?"],
    ["🔌","Laadproblemen","Telefoon laadt niet of valt uit?"],
    ["⚙️","Hardware & software","Diagnose en reparatie van verschillende problemen."]
  ],

  why:[
    ["⚡","Snelle service","We proberen de reparatie zo snel mogelijk uit te voeren."],
    ["🛠️","Professioneel","Nauwkeurige diagnose en netjes werk."],
    ["🚗","Wij komen naar jou","Mobiele service, zodat je niet hoeft te reizen."],
    ["💰","Betaalbare prijs","Vraag de prijs voordat we repareren."]
  ],

  phones:[
    {name:"iPhone 12",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
    {name:"iPhone 13",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
    {name:"iPhone 14",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
    {name:"iPhone 15",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
    {name:"iPhone 16",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
    {name:"iPhone 17",brand:"Apple",screen:"",software:"",hardware:"",camera:""}
  ]

};


let data =
  JSON.parse(localStorage.getItem(KEY)||"null") ||
  structuredClone(defaults);


if(!Array.isArray(data.phones)){

  data.phones =
    structuredClone(defaults.phones);

}


function wa(){

  const lang =
    localStorage.getItem("homsTechLanguage") || "nl";

  let message;


  if(lang === "ar"){

    message =
      "مرحبا، أريد الاستفسار عن تصليح هاتفي";

  }

  else if(lang === "en"){

    message =
      "Hello, I would like to ask about phone repair.";

  }

  else{

    message =
      "Hallo, ik wil graag informeren over telefoonreparatie.";

  }


  return "https://wa.me/" +
    data.whatsapp +
    "?text=" +
    encodeURIComponent(message);

}


function getTranslation(key){

  if(typeof window.getTranslation === "function"){

    return window.getTranslation(key);

  }

  return key;

}


function renderFilters(){

  const element =
    document.getElementById("filter");

  if(!element) return;


  const phones =
    Array.isArray(data.phones)
      ? data.phones
      : [];


  const brands = [];


  phones.forEach(function(phone){

    if(
      phone &&
      phone.brand &&
      !brands.includes(phone.brand)
    ){

      brands.push(phone.brand);

    }

  });


  const params =
    new URLSearchParams(window.location.search);

  const selectedBrand =
    params.get("brand") || "";


  let html = `

    <button
      type="button"
      class="${selectedBrand === "" ? "active" : ""}"
      data-brand=""
    >
      ${getTranslation("allDevices")}
    </button>

  `;


  brands.forEach(function(brand){

    html += `

      <button
        type="button"
        class="${selectedBrand === brand ? "active" : ""}"
        data-brand="${escapeHtml(brand)}"
      >
        ${escapeHtml(brand)}
      </button>

    `;

  });


  element.innerHTML = html;


  element
    .querySelectorAll("[data-brand]")
    .forEach(function(button){

      button.addEventListener("click",function(){

        const brand =
          button.getAttribute("data-brand");

        if(brand){

          history.replaceState(
            null,
            "",
            "prices.html?brand=" +
            encodeURIComponent(brand)
          );

        }

        else{

          history.replaceState(
            null,
            "",
            "prices.html"
          );

        }

        renderFilters();
        renderPrices();

      });

    });

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function renderPrices(){

  const element =
    document.getElementById("priceList");

  if(!element) return;


  const phones =
    Array.isArray(data.phones)
      ? data.phones
      : [];


  const params =
    new URLSearchParams(window.location.search);

  const selectedBrand =
    params.get("brand") || "";


  const filtered =
    selectedBrand
      ? phones.filter(function(phone){

          return phone &&
            phone.brand === selectedBrand;

        })
      : phones;


  if(filtered.length === 0){

    element.innerHTML = `

      <div class="empty">

        <h3>
          ${getEmptyTitle()}
        </h3>

        <p>
          ${getEmptyText()}
        </p>

      </div>

    `;

    return;

  }


  element.innerHTML =
    filtered.map(function(phone){

      const screen =
        phone.screen || "-";

      const software =
        phone.software || "-";

      const hardware =
        phone.hardware || "-";

      const camera =
        phone.camera || "-";


      return `

        <div class="card">

          <h3>
            ${escapeHtml(phone.name || "Phone")}
          </h3>

          <div class="prices">

            <div class="price">

              <b>
                ${getTranslation("screen")}
              </b>

              ${escapeHtml(screen)}

            </div>


            <div class="price">

              <b>
                ${getTranslation("software")}
              </b>

              ${escapeHtml(software)}

            </div>


            <div class="price">

              <b>
                ${getTranslation("hardware")}
              </b>

              ${escapeHtml(hardware)}

            </div>


            <div class="price">

              <b>
                ${getTranslation("camera")}
              </b>

              ${escapeHtml(camera)}

            </div>

          </div>


          <a
            class="btn green"
            data-wa
          >
            ${getTranslation("bookWhatsapp")}
          </a>

        </div>

      `;

    }).join("");


  element
    .querySelectorAll("[data-wa]")
    .forEach(function(button){

      button.href = wa();

    });

}


function getEmptyTitle(){

  const lang =
    localStorage.getItem("homsTechLanguage") || "nl";


  if(lang === "ar"){

    return "ما في أجهزة";

  }


  if(lang === "en"){

    return "No devices found";

  }


  return "Geen apparaten gevonden";

}


function getEmptyText(){

  const lang =
    localStorage.getItem("homsTechLanguage") || "nl";


  if(lang === "ar"){

    return "ما في أجهزة مطابقة للاختيار الحالي.";

  }


  if(lang === "en"){

    return "No devices match the current selection.";

  }


  return "Er zijn geen apparaten voor deze selectie.";

}


window.homsTechData = data;


window.renderCurrentPage = function(){


  document.querySelectorAll("[data-name]")
    .forEach(function(e){

      e.textContent =
        data.businessName;

    });


  document.querySelectorAll("[data-tag]")
    .forEach(function(e){

      e.textContent =
        data.tagline;

    });


  document.querySelectorAll("[data-wa]")
    .forEach(function(e){

      e.href = wa();

    });


  document.querySelectorAll("[data-phone]")
    .forEach(function(e){

      e.href =
        "tel:" +
        data.phone.replace(/\s/g,"");

    });


  renderFilters();

  renderPrices();

};


window.renderCurrentPage();

</script>


<script src="language.js"></script>


</body>

</html>
