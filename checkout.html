<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Afrekenen - HOMS TECH</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#111827}a{text-decoration:none;color:inherit}
header{background:#111827;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}.nav{max-width:1200px;margin:auto;min-height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{width:170px}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks a{padding:10px 14px;border-radius:10px;font-weight:700}.navlinks a:hover{background:#243044}.cart{background:#dc2626}
.wrap{max-width:1100px;margin:auto;padding:45px 20px 70px}.title{font-size:36px;margin:0 0 8px}.subtitle{color:#64748b;margin:0 0 28px}.layout{display:grid;grid-template-columns:1.35fr .85fr;gap:22px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 6px 25px rgba(15,23,42,.07)}h2{margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input{width:100%;padding:13px 14px;border:1px solid #dbe3ec;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.1)}.account-note{background:#f1f5f9;padding:12px 14px;border-radius:10px;color:#475569;margin-bottom:18px;font-size:14px}.item{display:grid;grid-template-columns:68px 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid #e5e7eb}.item:last-child{border-bottom:0}.item img{width:68px;height:68px;object-fit:contain;background:#f8fafc;border-radius:10px}.item-title{font-weight:800}.item-meta{font-size:13px;color:#64748b;margin-top:4px}.item-price{font-weight:900;white-space:nowrap}.total{margin-top:18px;padding-top:18px;border-top:2px solid #e5e7eb;display:flex;justify-content:space-between;font-size:24px;font-weight:900}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;padding:14px 20px;font-weight:800;cursor:pointer;font-size:15px}.red{background:#dc2626;color:#fff}.gray{background:#eef2f7;color:#111827}.submit{width:100%;margin-top:18px}.status{margin-top:14px;padding:12px 14px;border-radius:10px;display:none}.status.error{display:block;background:#fee2e2;color:#991b1b}.status.success{display:block;background:#dcfce7;color:#166534}.success-box{text-align:center;padding:35px 15px}.success-box .check{font-size:54px}.success-box h2{margin:10px 0}.order-number{font-weight:900;font-size:22px;margin:10px 0 20px}.hidden{display:none!important}
@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.nav{flex-direction:column;padding:12px 15px}.wrap{padding:30px 15px}.title{font-size:30px}}
</style>
<link rel="stylesheet" href="assets/homs-tech-modern-theme.css?v=20260921-3">
</head>
<body>
<header><div class="nav"><a href="index.html"><img src="assets/homs-tech-logo.png" class="logo" alt="HOMS TECH"></a><div class="navlinks"><a href="index.html">Home</a><a href="devices.html">Apparaten</a><a href="account.html">👤 Mijn account</a><a class="cart" href="cart.html">🛒 Winkelwagen</a></div></div></header>
<main class="wrap">
<h1 class="title">Afrekenen</h1><p class="subtitle">Vul uw gegevens in. Daarna ontvangt HOMS TECH uw bestelling.</p>
<div id="checkoutContent" class="layout">
<section class="card"><h2>📦 Uw gegevens</h2><div id="accountNote" class="account-note hidden"></div><form id="checkoutForm"><div class="grid">
<div class="field"><label for="name">Naam *</label><input id="name" required></div>
<div class="field"><label for="email">E-mail *</label><input id="email" type="email" required></div>
<div class="field"><label for="phone">Telefoonnummer *</label><input id="phone" type="tel" required></div>
<div class="field"><label for="postcode">Postcode *</label><input id="postcode" required></div>
<div class="field"><label for="street">Straat *</label><input id="street" required></div>
<div class="field"><label for="houseNumber">Huisnummer *</label><input id="houseNumber" required></div>
<div class="field full"><label for="city">Plaats *</label><input id="city" required></div>
</div><div id="status" class="status"></div><button id="submitBtn" class="btn red submit" type="submit">🛍️ Bestelling plaatsen</button></form></section>
<section class="card"><h2>🛒 Uw bestelling</h2><div id="items"></div><div class="total"><span>Totaal</span><span id="total">€0</span></div><a class="btn gray submit" href="cart.html">← Terug naar winkelwagen</a></section>
</div>
<div id="success" class="card success-box hidden"><div class="check">✅</div><h2>Bedankt voor uw bestelling!</h2><p>Uw bestelling is succesvol ontvangen door HOMS TECH.</p><div id="orderNumber" class="order-number"></div><a class="btn red" href="index.html">Terug naar Home</a></div>
</main>
<script>
function readCart(){try{return JSON.parse(localStorage.getItem('homsTechCart')||'[]')}catch(e){return[]}}
function money(n){return '€'+Number(n||0).toFixed(2).replace('.00','').replace('.',',')}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function optionsText(o){const m={storage:'Geheugen',color:'Kleur',condition:'Conditie',battery:'Batterij',vat:'BTW',tradeIn:'Inruil'};return Object.entries(o||{}).map(([k,v])=>`${m[k]||k}: ${esc(v)}`).join(' • ')}
function renderItems(){const items=readCart();if(!items.length){location.href='cart.html';return}let total=0;document.getElementById('items').innerHTML=items.map(x=>{const q=Number(x.qty||1),p=Number(x.unitPrice||0);total+=q*p;const image=x.image?`<img src="${esc(x.image)}" alt="">`:`<div style="width:68px;height:68px;border-radius:10px;background:#f8fafc;display:flex;align-items:center;justify-content:center;font-size:28px">📱</div>`;return `<div class="item">${image}<div><div class="item-title">${esc(x.name)}</div><div class="item-meta">${optionsText(x.options)}<br>Aantal: ${q}</div></div><div class="item-price">${money(q*p)}</div></div>`}).join('');document.getElementById('total').textContent=money(total)}
async function prefill(){try{const r=await fetch('/api/customer/me',{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(!d.authenticated||!d.customer)return;const c=d.customer;document.getElementById('name').value=c.name||'';document.getElementById('email').value=c.email||'';document.getElementById('phone').value=c.phone||'';if(c.address)document.getElementById('street').value=c.address||'';document.getElementById('accountNote').textContent='Je bent ingelogd. We hebben je bekende gegevens alvast ingevuld.';document.getElementById('accountNote').classList.remove('hidden')}catch(e){}}
function showStatus(msg,type){const s=document.getElementById('status');s.textContent=msg;s.className='status '+type}
document.getElementById('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();const items=readCart();if(!items.length){location.href='cart.html';return}const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Bestelling plaatsen...';showStatus('', '');try{const payload={name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),street:document.getElementById('street').value.trim(),houseNumber:document.getElementById('houseNumber').value.trim(),postcode:document.getElementById('postcode').value.trim(),city:document.getElementById('city').value.trim(),items};const r=await fetch('/api/webshop/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await r.json().catch(()=>({}));if(!r.ok)throw new Error(result.error||'Bestelling kon niet worden geplaatst.');localStorage.removeItem('homsTechCart');document.getElementById('checkoutContent').classList.add('hidden');document.getElementById('success').classList.remove('hidden');document.getElementById('orderNumber').textContent='Bestelnummer #'+result.order.id}catch(err){showStatus('✕ '+err.message,'error');btn.disabled=false;btn.textContent='🛍️ Bestelling plaatsen'}});
renderItems();prefill();
</script>
</body></html>
