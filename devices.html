<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنواع الأجهزة | HOMS TECH</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fa;color:#111827;line-height:1.7}
header{background:#111827;color:#fff;padding:12px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px;position:sticky;top:0;z-index:10}.brand img{width:145px;height:auto;display:block}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}nav a{color:#fff;text-decoration:none;font-weight:700;padding:9px 12px;border-radius:8px}nav a:hover,nav a.active{background:#26354d}
.btn{display:inline-block;padding:12px 20px;border-radius:11px;font-weight:800;text-decoration:none;border:0;cursor:pointer}.green{background:#25d366;color:#fff}.white{background:#fff;color:#111827}.dark{background:#111827;color:#fff}
.hero{background:linear-gradient(135deg,#111827,#30425c);color:#fff;text-align:center;padding:80px 6%}.hero h1{font-size:clamp(36px,7vw,62px);line-height:1.2;margin:0 0 16px}.hero p{font-size:20px;max-width:760px;margin:0 auto 25px;color:#e5e7eb}
main{min-height:calc(100vh - 150px)}section{max-width:1100px;margin:auto;padding:55px 6%}h1.page-title,h2{text-align:center;font-size:34px}.intro{text-align:center;max-width:800px;margin:auto;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card,.about{background:#fff;border-radius:18px;padding:24px;box-shadow:0 7px 25px #0000000c;text-align:center}.icon{font-size:40px}.card h3{margin:8px 0}.card p{color:#6b7280;margin:0}.banner{background:#25d366;color:#fff;border-radius:22px;padding:34px;text-align:center}.banner h2{margin:0 0 5px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.price{background:#f3f4f6;border-radius:9px;padding:9px;text-align:right}.price b{display:block}
footer{background:#111827;color:#ddd;text-align:center;padding:28px}.small{color:#9ca3af;font-size:14px}
@media(max-width:850px){header{position:relative;flex-wrap:wrap;justify-content:center}nav{order:3;width:100%}nav a{font-size:14px}.brand img{width:130px}}
@media(max-width:500px){nav a{padding:7px 8px;font-size:13px}.hero{padding:55px 5%}.prices{grid-template-columns:1fr}}
</style></head><body>
<header><a class="brand" href="index.html"><img src="assets/homs-tech-logo.png" alt="HOMS TECH"></a>
<nav><a href="index.html">الرئيسية</a><a href="about.html">مين نحن</a><a href="repair.html">شو منصلّح</a><a href="devices.html">أنواع الأجهزة</a><a href="prices.html">الأسعار</a></nav>
<a class="btn green" data-wa>واتساب</a></header><main>
<section><h1 class="page-title">📱 أنواع الأجهزة</h1><p class="intro">اختار الشركة لمشاهدة الأجهزة والأسعار.</p>
<div id="devices" class="grid"></div></section></main>
<footer><strong data-name>HOMS TECH</strong><p data-tag>تصليح هواتف عند باب بيتك</p><p class="small">© HOMS TECH</p><a class="btn white" href="admin/index.html">⚙️ لوحة التحكم</a></footer>
<script>
const KEY="homsTechData";
const defaults={businessName:"HOMS TECH",tagline:"تصليح هواتف عند باب بيتك",heroTitle:"موبايلك خربان؟ نحن منجي لعندك! 🚗📱",heroText:"تصليح جميع أنواع الهواتف عند باب بيتك — خدمة سريعة، شغل نظيف وأسعار مناسبة.",whatsapp:"31612345678",phone:"+31 6 12345678",areas:"Rotterdam والمناطق القريبة",
services:[["🖥️","تبديل الشاشات","شاشة مكسورة أو لا تعمل؟"],["🔋","تبديل البطاريات","بطارية ضعيفة أو تفرغ بسرعة؟"],["🔌","أعطال الشحن","الجهاز لا يشحن أو يفصل؟"],["⚙️","هاردوير وسوفتوير","تشخيص وإصلاح مختلف الأعطال."]],
why:[["⚡","سريع","نحاول ننجز التصليح بأسرع وقت ممكن."],["🛠️","احترافي","تشخيص دقيق وشغل مرتب."],["🚗","نجي لعندك","خدمة متنقلة بدل ما تتعب وتطلع."],["💰","سعر مناسب","اسألنا عن السعر قبل التصليح."]],
phones:[
{name:"iPhone 12",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
{name:"iPhone 13",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
{name:"iPhone 14",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
{name:"iPhone 15",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
{name:"iPhone 16",brand:"Apple",screen:"",software:"",hardware:"",camera:""},
{name:"iPhone 17",brand:"Apple",screen:"",software:"",hardware:"",camera:""}]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(defaults);
if(!Array.isArray(data.phones)) data.phones=structuredClone(defaults.phones);
function saveData(){localStorage.setItem(KEY,JSON.stringify(data))}
function wa(){return "https://wa.me/"+data.whatsapp+"?text="+encodeURIComponent("مرحبا، أريد الاستفسار عن تصليح هاتفي");}
function common(){
 document.querySelectorAll("[data-name]").forEach(e=>e.textContent=data.businessName);
 document.querySelectorAll("[data-tag]").forEach(e=>e.textContent=data.tagline);
 document.querySelectorAll("[data-wa]").forEach(e=>e.href=wa());
 document.querySelectorAll("[data-phone]").forEach(e=>e.href="tel:"+data.phone.replace(/\s/g,""));
}
function renderServices(id="services"){let e=document.getElementById(id);if(e)e.innerHTML=data.services.map(x=>`<div class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}
function renderWhy(id="why"){let e=document.getElementById(id);if(e)e.innerHTML=data.why.map(x=>`<div class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}
function renderPrices(list=data.phones,id="priceList"){let e=document.getElementById(id);if(!e)return;e.innerHTML=list.map(p=>`<div class="card"><h3>${p.name}</h3><div class="prices"><div class="price"><b>🖥️ الشاشة</b>${p.screen||"اتصل للسعر"}</div><div class="price"><b>💻 السوفتوير</b>${p.software||"اتصل للسعر"}</div><div class="price"><b>🔧 الهاردوير</b>${p.hardware||"اتصل للسعر"}</div><div class="price"><b>📷 الكاميرا</b>${p.camera||"اتصل للسعر"}</div></div><br><a class="btn green" href="${wa()}">احجز عبر واتساب</a></div>`).join("")}
common();
let brands=[...new Set(data.phones.map(p=>p.brand||"Apple"))];document.getElementById("devices").innerHTML=brands.map(b=>`<a class="card" href="prices.html?brand=${encodeURIComponent(b)}"><div class="icon">📱</div><h3>${b}</h3><p>اضغط لعرض الموديلات والأسعار</p></a>`).join("");</script></body></html>
