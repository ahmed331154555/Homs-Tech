name: HOMS TECH tests
# Launch validation for the isolated tactile UI branch.

on:
  push:
    branches:
      - HomsTech-Clean
      - feature/phone-orders-split-detail
      - chore/homs-tech-code-cleanup
      - work/homs-tech-code-cleanup-professional
      - feature/memory-optimization
      - fix/homepage-phone-catalog-recovery
      - feature/repair-booking-v2-clean
      - fix/preserve-footer-review-widgets
      - backup/battery-configurator-cleanup-2026-11-17
      - aboode-test-3-tactile-ui
  pull_request:
    branches:
      - HomsTech-Clean
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homs-tech-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format and commit button styles
        run: |
          npx --yes prettier@3.6.2 --write assets/tactile-ui.css assets/homs-admin-standalone-premium.css
          if ! git diff --quiet -- assets/tactile-ui.css assets/homs-admin-standalone-premium.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/tactile-ui.css assets/homs-admin-standalone-premium.css
            git commit -m "style: normalize remaining action buttons"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Check formatting of maintained source files
        run: |
          npx --yes prettier@3.6.2 --check --embedded-language-formatting off "**/*.{js,cjs,mjs,json,css,html,yml,yaml,md}" "!assets/homs-admin.js" "!assets/homs-admin.css" "!assets/homs-global-nav.js" "!assets/homs-site-footer.js" "!assets/homs-announcement-bars.js" "!assets/customer-reviews-widget.js" "!devices.html" "!shop.html" "!.github/workflows/homs-tech-tests.yml"

      - name: Check whitespace errors
        run: git diff --check

      - name: Check JavaScript syntax
        run: find server.js config routes utils test assets scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check admin inline scripts
        run: node scripts/check-admin-inline.js

      - name: Test bounded rate limiter
        run: node --test test/bounded-rate-limit.test.js

      - name: Check local HTML assets
        run: node scripts/check-local-assets.js

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run full test suite
        run: npm test

      - name: Smoke test deployed HOMS TECH website
        env:
          HOMS_BASE_URL: https://homs-tech.nl
        run: node scripts/smoke-production.js

