name: HOMS TECH tests
# Professional cleanup branch: validate extracted admin assets, visual layer and order-inspection safeguards.

on:
  push:
    branches:
      - HomsTech-Clean
      - feature/phone-orders-split-detail
      - chore/homs-tech-code-cleanup
      - work/homs-tech-code-cleanup-professional
  pull_request:
    branches:
      - HomsTech-Clean
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homs-tech-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: find server.js config routes utils test assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check admin inline scripts
        run: node scripts/check-admin-inline.js

      - name: Check local HTML assets
        run: node scripts/check-local-assets.js

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
