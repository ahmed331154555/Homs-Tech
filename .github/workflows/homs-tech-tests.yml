name: HOMS TECH tests
# Format the maintained source tree, then validate the formatted working tree before committing it.

on:
  push:
    branches:
      - HomsTech-Clean
      - feature/phone-orders-split-detail
      - chore/homs-tech-code-cleanup
      - work/homs-tech-code-cleanup-professional
      - feature/memory-optimization
      - fix/homepage-phone-catalog-recovery
      - feature/repair-booking-v2-clean
      - fix/preserve-footer-review-widgets
      - backup/battery-configurator-cleanup-2026-11-17
  pull_request:
    branches:
      - HomsTech-Clean
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homs-tech-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Format maintained source files
        run: |
          npx --yes prettier@3.6.2 --write --embedded-language-formatting off "**/*.{js,cjs,mjs,json,css,html,yml,yaml,md}" "!server.js" "!routes/**" "!assets/homs-admin.js" "!assets/homs-admin.css" "!assets/homs-global-nav.js" "!assets/homs-site-footer.js" "!assets/homs-announcement-bars.js" "!assets/customer-reviews-widget.js" "!devices.html" "!shop.html"

      - name: Check whitespace errors
        run: git diff --check

      - name: Check JavaScript syntax
        run: find server.js config routes utils test assets scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check admin inline scripts
        run: node scripts/check-admin-inline.js

      - name: Test bounded rate limiter
        run: node --test test/bounded-rate-limit.test.js

      - name: Check local HTML assets
        run: node scripts/check-local-assets.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full test suite
        run: npm test

      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "style: format and clean HOMS TECH source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
