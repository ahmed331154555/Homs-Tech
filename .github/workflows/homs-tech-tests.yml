name: HOMS TECH tests

on:
  push:
    branches:
      - HomsTech-Clean
  pull_request:
    branches:
      - HomsTech-Clean

permissions:
  contents: read

jobs:
  test:
    name: Node.js test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: find server.js config routes utils test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
