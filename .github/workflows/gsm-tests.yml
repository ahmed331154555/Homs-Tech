name: GSM System Tests

on:
  push:
    branches:
      - build-gsm-system-2026-10-10
  pull_request:
    branches:
      - build-gsm-system-2026-10-10

permissions:
  contents: read

jobs:
  gsm-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server syntax
        run: node --check server.js
      - name: Check provider syntax
        run: node --check lib/gsm-provider.js
      - name: Check admin inline JavaScript
        run: node -e "const fs=require('node:fs');const html=fs.readFileSync('admin/index.html','utf8');const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());scripts.forEach((s,i)=>{try{new Function(s)}catch(e){console.error('Admin inline script '+(i+1)+': '+e.message);process.exitCode=1}});console.log('Checked '+scripts.length+' inline script blocks')"
      - name: Run GSM provider tests
        run: npm run test:gsm
