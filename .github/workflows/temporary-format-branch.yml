name: Temporary HOMS TECH branch formatter
on:
  push:
    branches:
      - aboode-test-3-tactile-ui
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format the four files reported by CI
        run: |
          npx --yes prettier@3.6.2 --write --embedded-language-formatting off admin/index.html test/admin-mobile-layout.test.js test/button-type-safety.test.js uw-toestel-verkopen.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html test/admin-mobile-layout.test.js test/button-type-safety.test.js uw-toestel-verkopen.html
          if ! git diff --cached --quiet; then
            git commit -m "style: format maintained source files"
            git push
          fi
