name: Partner API tests

on:
  push:
    branches:
      - feature/partner-store-api
  pull_request:
    branches:
      - main

jobs:
  partner-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
