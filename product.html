<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Product - HOMS TECH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#111827;line-height:1.6}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:1000;background:#111827;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.nav{max-width:1200px;margin:auto;min-height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{width:170px;display:block}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:10px 14px;border-radius:10px;color:#fff;font-weight:600}
nav a:hover{background:#2563eb}
.section{max-width:1200px;margin:auto;padding:55px 20px}
.back{display:inline-block;margin-bottom:25px;color:#2563eb;font-weight:700}
.product{display:grid;grid-template-columns:1fr 1fr;gap:45px;background:#fff;border-radius:24px;padding:35px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
.gallery{min-width:0}
.main-image{width:100%;height:430px;object-fit:contain;background:#f8fafc;border-radius:18px;padding:20px}
.thumbs{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.thumb{width:78px;height:78px;object-fit:cover;background:#f8fafc;border:2px solid #e5e7eb;border-radius:10px;padding:4px;cursor:pointer}
.thumb.active{border-color:#2563eb}
.info h1{font-size:38px;line-height:1.2;margin-bottom:8px}
.brand{color:#2563eb;font-weight:700;font-size:18px;margin-bottom:20px}
.price{font-size:34px;font-weight:800;margin:20px 0;color:#111827}
.meta{display:grid;gap:10px;margin:20px 0}
.meta div{padding:13px 15px;background:#f8fafc;border-radius:10px}
.meta strong{display:inline-block;min-width:115px}
.description{margin:25px 0;color:#4b5563}
.buttons{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:11px;font-weight:800;border:0;cursor:pointer}
.green{background:#16c766;color:#fff}
.blue{background:#2563eb;color:#fff}
.gray{background:#eef2f7;color:#111827}
.btn:hover{opacity:.9}
.status{padding:14px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-top:15px}
.option-section{margin:22px 0}
.option-title{font-weight:800;font-size:17px;margin-bottom:10px}
.option-grid{display:flex;flex-wrap:wrap;gap:9px}
.option-btn{border:1px solid #dbe3ec;background:#fff;color:#111827;border-radius:11px;padding:11px 14px;cursor:pointer;font-weight:700;min-width:90px;text-align:left}
.option-btn:hover{border-color:#2563eb}
.option-btn.active{border-color:#2563eb;background:#eff6ff;box-shadow:0 0 0 2px rgba(37,99,235,.10)}
.option-btn small{display:block;color:#6b7280;font-weight:600;margin-top:2px}
.order-summary{margin-top:22px;background:#111827;color:#fff;border-radius:18px;padding:20px}
.order-summary h3{font-size:20px;margin-bottom:12px}
.summary-row{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.summary-row:last-child{border-bottom:0}
.summary-total{font-size:24px;font-weight:900;margin-top:12px}
.spec-box{margin-top:25px}
.spec-box h2{font-size:25px;margin-bottom:12px}
.spec-list{display:grid;gap:8px}
.spec-list div{padding:10px 12px;background:#f8fafc;border-radius:9px}
.empty{text-align:center;background:#fff;border-radius:20px;padding:60px 25px}
footer{background:#0b1422;color:#cbd5e1;padding:35px 20px;margin-top:30px}
.footer-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer-name{color:#fff;font-size:20px;font-weight:800}
@media(max-width:800px){
.product{grid-template-columns:1fr;padding:22px}
.main-image{height:330px}
.info h1{font-size:30px}
.nav{flex-direction:column;padding:12px 15px}
nav{justify-content:center}
}
</style>
</head>
<body>

<header>
<div class="nav">
<a href="index.html"><img src="assets/homs-tech-logo.png" class="logo" alt="HOMS TECH"></a>
<nav>
<a href="index.html">Home</a>
<a href="about.html">Over ons</a>
<a href="repair.html">Reparaties</a>
<a href="devices.html">Apparaten</a>
<a href="prices.html">Prijzen</a>
</nav>
</div>
</header>

<main class="section">
<a class="back" href="devices.html">← Terug naar apparaten</a>
<div id="productArea"></div>
</main>

<footer>
<div class="footer-inner">
<div>
<div class="footer-name" id="footerName">HOMS TECH</div>
<div id="footerTag">Telefoonreparatie aan huis</div>
</div>
</div>
</footer>

<script>
const params = new URLSearchParams(location.search);
const type = params.get("type") || "phone";
const id = Number(params.get("id"));

function esc(v){
return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function euro(v){
if(v===undefined || v===null || v==="") return "";
const s=String(v);
return s.includes("€") ? s : "€"+s;
}

function wa(number){
const n=String(number||"").replace(/\D/g,"");
return n ? "https://wa.me/"+n : "#";
}

let selectedOptions={};
let currentProduct=null;
let currentData=null;

function num(v){
  const cleaned=String(v??"").replace(/€/g,"").replace(/\s/g,"").replace(",",".");
  const n=parseFloat(cleaned);
  return Number.isFinite(n)?n:0;
}
function optionList(list){
  return Array.isArray(list)?list.filter(x=>x&&x.label&&x.enabled!==false):[];
}
function effectiveOptions(product,key){
  const base=num(product.price || product.salePrice || product.sellPrice || 0);
  if(key==="condition") return [
    {label:"Zichtbaar gebruikt",priceDelta:0},
    {label:"Licht gebruikt",priceDelta:51},
    {label:"Zo goed als nieuw",priceDelta:102}
  ];
  if(key==="vat") return [
    {label:"Zonder BTW",priceDelta:0},
    {label:"Met BTW",priceDelta:10}
  ];
  if(key==="battery") return [
    {label:"Standaard",priceDelta:0},
    {label:"Nieuw (100%)",priceDelta:30}
  ];
  if(key==="tradeIn") return [
    {label:"Nee",priceDelta:0},
    {label:"Ja",priceDelta:0}
  ];
  return optionList(product[key+"Options"]);
}
function optionDelta(x){
  if(!x) return 0;

  const raw = x.priceDelta ?? x.delta ?? x.priceAdjustment ?? x.extra ?? x.amount ?? x.value;
  if(raw !== undefined && raw !== null && raw !== ""){
    const n=num(raw);
    if(n !== 0) return n;
  }

  const label=String(x.label||"");
  const match=label.match(/([+-])\s*€?\s*(\d+(?:[.,]\d+)?)\s*$/);
  if(match){
    const amount=parseFloat(match[2].replace(",","."));
    return match[1]==="-" ? -amount : amount;
  }

  if(x.price !== undefined && x.price !== null && x.price !== ""){
    return num(x.price);
  }

  return 0;
}
function money(n){ return "€"+Number(n||0).toFixed(2).replace(".00","").replace(".",","); }
function calculateTotal(product){
  const base=num(product.price || product.salePrice || product.sellPrice || 0);
  let total=base;
  ["storage","color","condition","battery","vat","tradeIn"].forEach(key=>{
    const list=effectiveOptions(product,key);
    const chosen=list.find(x=>x.label===selectedOptions[key]);
    if(chosen) total+=optionDelta(chosen);
  });
  return Math.max(0,total);
}
function selectProductOption(key,label){
  selectedOptions[key]=label;
  renderProductBody();
}
function renderOptionSection(key,title,list){
  list=key==="condition"||key==="vat"||key==="battery"||key==="tradeIn" ? effectiveOptions(currentProduct,key) : optionList(list);
  if(!list.length) return "";
  if(!selectedOptions[key]) selectedOptions[key]=list[0].label;
  return `<div class="option-section"><div class="option-title">${esc(title)}</div><div class="option-grid">${list.map(x=>{
    const active=x.label===selectedOptions[key];
    return `<button type="button" class="option-btn ${active?"active":""}" onclick="selectProductOption('${esc(key)}','${esc(x.label)}')">${esc(x.label)}</button>`;
  }).join("")}</div></div>`;
}
function renderProductBody(){
  const product=currentProduct,data=currentData;
  const area=document.getElementById("productArea");
  const images=Array.isArray(product.images)?product.images.filter(Boolean):[];
  const mainImage=product.image||images[0]||"";
  let gallery=mainImage?`<img id="mainImage" class="main-image" src="${esc(mainImage)}" alt="${esc(product.name)}">`:`<div class="main-image" style="display:flex;align-items:center;justify-content:center;font-size:80px;">📱</div>`;
  if(mainImage&&images.length) gallery+=`<div class="thumbs">${images.map((img,i)=>`<img class="thumb ${i===0?"active":""}" src="${esc(img)}" alt="" onclick="changeImage(this,'${esc(img)}')">`).join("")}</div>`;

  const basePrice=num(product.price||product.salePrice||product.sellPrice||0);
  const hasOptions=true;
  const total=calculateTotal(product);
  const storage=product.storage||product.geheugen||"";
  const color=product.color||product.kleur||"";
  const condition=product.condition||product.conditie||"";
  const warranty=product.warranty||product.garantie||"";
  const description=product.description||product.beschrijving||"";
  const whatsapp=wa(data.whatsapp);
  const title=product.name||"Smartphone";

  let specs="";
  if(storage) specs+=`<div><strong>Opslag:</strong> ${esc(storage)}</div>`;
  if(color) specs+=`<div><strong>Kleur:</strong> ${esc(color)}</div>`;
  if(condition) specs+=`<div><strong>Conditie:</strong> ${esc(condition)}</div>`;
  if(warranty) specs+=`<div><strong>Garantie:</strong> ${esc(warranty)}</div>`;
  if(product.screen) specs+=`<div><strong>Scherm reparatie:</strong> ${euro(esc(product.screen))}</div>`;
  if(product.software) specs+=`<div><strong>Software:</strong> ${euro(esc(product.software))}</div>`;
  if(product.hardware) specs+=`<div><strong>Hardware:</strong> ${euro(esc(product.hardware))}</div>`;
  if(product.camera) specs+=`<div><strong>Camera:</strong> ${euro(esc(product.camera))}</div>`;

  const specsList=Array.isArray(product.specifications)?product.specifications.filter(x=>x&&x.label):[];
  const optionsHtml=hasOptions?[
    renderOptionSection("storage","1. Geheugen",product.storageOptions),
    renderOptionSection("color","2. Kleur",product.colorOptions),
    renderOptionSection("condition","3. Productconditie",product.conditionOptions),
    renderOptionSection("battery","4. Batterij",product.batteryOptions),
    renderOptionSection("vat","5. BTW-keuze",product.vatOptions),
    renderOptionSection("tradeIn","6. Inruil oude telefoon",product.tradeInOptions)
  ].join(""):"";

  area.innerHTML=`<div class="product"><div class="gallery">${gallery}</div><div class="info">
    <div class="brand">${esc(product.brand||"HOMS TECH")}</div>
    <h1>${esc(title)}</h1>
    <div class="price">${hasOptions?money(total):(basePrice?euro(esc(basePrice)):"")}</div>
    ${specs?`<div class="meta">${specs}</div>`:""}
    ${optionsHtml}
    ${hasOptions?`<div class="order-summary"><h3>Jouw bestelling</h3>${["storage","color","condition","battery","vat","tradeIn"].filter(k=>selectedOptions[k]).map(k=>`<div class="summary-row"><span>${esc(k==="storage"?"Geheugen":k==="color"?"Kleur":k==="condition"?"Conditie":k==="battery"?"Batterij":k==="vat"?"BTW":"Inruil")}</span><strong>${esc(selectedOptions[k])}</strong></div>`).join("")}<div class="summary-total">Totaal: ${money(total)}</div></div>`:""}
    ${description?`<div class="description">${esc(description)}</div>`:""}
    ${specsList.length?`<div class="spec-box"><h2>Belangrijkste specificaties</h2><div class="spec-list">${specsList.map(x=>`<div><strong>${esc(x.label)}:</strong> ${esc(x.value||"")}</div>`).join("")}</div></div>`:""}
    <div class="buttons"><a class="btn green" href="${esc(whatsapp)}" target="_blank">💬 Bestel via WhatsApp</a><a class="btn gray" href="devices.html">← Apparaten</a></div>
    ${!basePrice&&!hasOptions?`<div class="status">Neem contact met ons op voor de actuele prijs.</div>`:""}
  </div></div>`;
}

function render(product,data){
  if(!product){document.getElementById("productArea").innerHTML=`<div class="empty"><h2>Product niet gevonden</h2><p>Dit apparaat bestaat niet of is niet meer beschikbaar.</p></div>`;return;}
  currentProduct=product; currentData=data;
  selectedOptions={};
  ["storage","color","condition","battery","vat","tradeIn"].forEach(key=>{const list=effectiveOptions(product,key);if(list.length)selectedOptions[key]=list[0].label;});
  renderProductBody();
}
async function load(){
try{
const response=await fetch("/api/site");
if(!response.ok) throw new Error("API error");
const data=await response.json();

document.getElementById("footerName").textContent=data.businessName||data.siteName||"HOMS TECH";
document.getElementById("footerTag").textContent=data.tagline||"Telefoonreparatie aan huis";

let list=[];
if(type==="used"){
list=Array.isArray(data.usedPhones)?data.usedPhones:[];
}else{
list=Array.isArray(data.phones)?data.phones:[];
if(!list.length && Array.isArray(data.devices)) list=data.devices;
}

const product=Number.isInteger(id) && id>=0 ? list[id] : null;
render(product,data);
}catch(e){
console.error("HOMS TECH:",e);
document.getElementById("productArea").innerHTML=
`<div class="empty"><h2>Product kan niet worden geladen</h2><p>Probeer het opnieuw.</p></div>`;
}
}

load();
</script>
</body>
</html>
