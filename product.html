<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Product - HOMS TECH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#111827;line-height:1.6}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:1000;background:#111827;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.nav{max-width:1200px;margin:auto;min-height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{width:170px;display:block}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{padding:10px 14px;border-radius:10px;color:#fff;font-weight:600}
nav a:hover{background:#2563eb}
.section{max-width:1200px;margin:auto;padding:55px 20px}
.back{display:inline-block;margin-bottom:25px;color:#2563eb;font-weight:700}
.product{display:grid;grid-template-columns:1fr 1fr;gap:45px;background:#fff;border-radius:24px;padding:35px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
.gallery{min-width:0}
.main-image{width:100%;height:430px;object-fit:contain;background:#f8fafc;border-radius:18px;padding:20px}
.thumbs{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.thumb{width:78px;height:78px;object-fit:cover;background:#f8fafc;border:2px solid #e5e7eb;border-radius:10px;padding:4px;cursor:pointer}
.thumb.active{border-color:#2563eb}
.info h1{font-size:38px;line-height:1.2;margin-bottom:8px}
.brand{color:#2563eb;font-weight:700;font-size:18px;margin-bottom:20px}
.price{font-size:34px;font-weight:800;margin:20px 0;color:#111827}
.meta{display:grid;gap:10px;margin:20px 0}
.meta div{padding:13px 15px;background:#f8fafc;border-radius:10px}
.meta strong{display:inline-block;min-width:115px}
.description{margin:25px 0;color:#4b5563}
.buttons{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 22px;border-radius:11px;font-weight:800;border:0;cursor:pointer}
.green{background:#16c766;color:#fff}
.blue{background:#2563eb;color:#fff}
.gray{background:#eef2f7;color:#111827}
.btn:hover{opacity:.9}
.status{padding:14px;border-radius:10px;background:#fff7ed;color:#9a3412;margin-top:15px}
.empty{text-align:center;background:#fff;border-radius:20px;padding:60px 25px}
footer{background:#0b1422;color:#cbd5e1;padding:35px 20px;margin-top:30px}
.footer-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer-name{color:#fff;font-size:20px;font-weight:800}
@media(max-width:800px){
.product{grid-template-columns:1fr;padding:22px}
.main-image{height:330px}
.info h1{font-size:30px}
.nav{flex-direction:column;padding:12px 15px}
nav{justify-content:center}
}
</style>
</head>
<body>

<header>
<div class="nav">
<a href="index.html"><img src="assets/homs-tech-logo.png" class="logo" alt="HOMS TECH"></a>
<nav>
<a href="index.html">Home</a>
<a href="about.html">Over ons</a>
<a href="repair.html">Reparaties</a>
<a href="devices.html">Apparaten</a>
<a href="prices.html">Prijzen</a>
</nav>
</div>
</header>

<main class="section">
<a class="back" href="devices.html">← Terug naar apparaten</a>
<div id="productArea"></div>
</main>

<footer>
<div class="footer-inner">
<div>
<div class="footer-name" id="footerName">HOMS TECH</div>
<div id="footerTag">Telefoonreparatie aan huis</div>
</div>
</div>
</footer>

<script>
const params = new URLSearchParams(location.search);
const type = params.get("type") || "phone";
const id = Number(params.get("id"));

function esc(v){
return String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function euro(v){
if(v===undefined || v===null || v==="") return "";
const s=String(v);
return s.includes("€") ? s : "€"+s;
}

function wa(number){
const n=String(number||"").replace(/\D/g,"");
return n ? "https://wa.me/"+n : "#";
}

function render(product,data){
const area=document.getElementById("productArea");

if(!product){
area.innerHTML=`<div class="empty"><h2>Product niet gevonden</h2><p>Dit apparaat bestaat niet of is niet meer beschikbaar.</p></div>`;
return;
}

const images=Array.isArray(product.images)?product.images.filter(Boolean):[];
const mainImage=product.image || images[0] || "";

let gallery="";
if(mainImage){
gallery=`<img id="mainImage" class="main-image" src="${esc(mainImage)}" alt="${esc(product.name)}">`;
if(images.length){
gallery+=`<div class="thumbs">${images.map((img,i)=>`
<img class="thumb ${i===0?"active":""}" src="${esc(img)}" alt="" onclick="changeImage(this,'${esc(img)}')">
`).join("")}</div>`;
}
}else{
gallery=`<div class="main-image" style="display:flex;align-items:center;justify-content:center;font-size:80px;">📱</div>`;
}

const price=product.price || product.salePrice || product.sellPrice || "";
const storage=product.storage || product.geheugen || "";
const color=product.color || product.kleur || "";
const condition=product.condition || product.conditie || "";
const warranty=product.warranty || product.garantie || "";
const description=product.description || product.beschrijving || "";

let specs="";
if(storage) specs+=`<div><strong>Opslag:</strong> ${esc(storage)}</div>`;
if(color) specs+=`<div><strong>Kleur:</strong> ${esc(color)}</div>`;
if(condition) specs+=`<div><strong>Conditie:</strong> ${esc(condition)}</div>`;
if(warranty) specs+=`<div><strong>Garantie:</strong> ${esc(warranty)}</div>`;

if(product.screen) specs+=`<div><strong>Scherm reparatie:</strong> ${euro(esc(product.screen))}</div>`;
if(product.software) specs+=`<div><strong>Software:</strong> ${euro(esc(product.software))}</div>`;
if(product.hardware) specs+=`<div><strong>Hardware:</strong> ${euro(esc(product.hardware))}</div>`;
if(product.camera) specs+=`<div><strong>Camera:</strong> ${euro(esc(product.camera))}</div>`;

const whatsapp=wa(data.whatsapp);
const title=product.name || "Smartphone";

area.innerHTML=`
<div class="product">
<div class="gallery">${gallery}</div>
<div class="info">
<div class="brand">${esc(product.brand || "HOMS TECH")}</div>
<h1>${esc(title)}</h1>
${price ? `<div class="price">${euro(esc(price))}</div>` : ""}
${specs ? `<div class="meta">${specs}</div>` : ""}
${description ? `<div class="description">${esc(description)}</div>` : ""}
<div class="buttons">
<a class="btn green" href="${esc(whatsapp)}" target="_blank">💬 Vraag via WhatsApp</a>
<a class="btn blue" href="repair.html">🔧 Reparatie</a>
<a class="btn gray" href="devices.html">← Apparaten</a>
</div>
${!price ? `<div class="status">Neem contact met ons op voor de actuele prijs.</div>` : ""}
</div>
</div>`;
}

function changeImage(el,url){
const main=document.getElementById("mainImage");
if(main) main.src=url;
document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));
el.classList.add("active");
}

async function load(){
try{
const response=await fetch("/api/site");
if(!response.ok) throw new Error("API error");
const data=await response.json();

document.getElementById("footerName").textContent=data.businessName||data.siteName||"HOMS TECH";
document.getElementById("footerTag").textContent=data.tagline||"Telefoonreparatie aan huis";

let list=[];
if(type==="used"){
list=Array.isArray(data.usedPhones)?data.usedPhones:[];
}else{
list=Array.isArray(data.phones)?data.phones:[];
if(!list.length && Array.isArray(data.devices)) list=data.devices;
}

const product=Number.isInteger(id) && id>=0 ? list[id] : null;
render(product,data);
}catch(e){
console.error("HOMS TECH:",e);
document.getElementById("productArea").innerHTML=
`<div class="empty"><h2>Product kan niet worden geladen</h2><p>Probeer het opnieuw.</p></div>`;
}
}

load();
</script>
</body>
</html>
