<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firmware Library — HOMS TECH</title>
<style>
:root{--navy:#071a33;--blue:#1264a3;--cyan:#2eb7d7;--muted:#65758b;--line:#dce5ee;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Inter,Arial,sans-serif;color:var(--navy)}header{background:#071a33;color:#fff;padding:17px 22px;box-shadow:0 4px 20px #071a3322}.head{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:900;letter-spacing:1px;font-size:22px}.brand span{color:#35c3df}.head a{color:#d9eaff;text-decoration:none}.wrap{max-width:1180px;margin:28px auto;padding:0 18px}.hero{background:linear-gradient(120deg,#09264a,#104d7c);color:white;border-radius:20px;padding:26px;margin-bottom:22px;box-shadow:0 14px 34px #09264a22}.eyebrow{color:#8ee8ff;font-size:12px;font-weight:800;letter-spacing:1.4px}.hero h1{font-size:clamp(25px,4vw,38px);margin:6px 0}.hero p{margin:0;color:#d7e9f8}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.crumb{color:var(--muted);font-size:14px}.crumb button{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.item{border:1px solid var(--line);background:white;border-radius:14px;padding:16px;min-height:125px;box-shadow:0 5px 15px #173b5c08}.folderbtn{border:0;background:transparent;padding:0;width:100%;display:flex;gap:12px;text-align:left;align-items:center;cursor:pointer;color:inherit}.foldericon{width:58px;height:44px;flex:none;position:relative;border-radius:5px 7px 7px 7px;background:linear-gradient(145deg,#2c8cc4,#07508d);box-shadow:inset 0 -5px 0 #003f72}.foldericon:before{content:"";position:absolute;left:3px;top:-7px;width:24px;height:10px;border-radius:4px 4px 0 0;background:#267db4}.foldericon:after{content:"H";position:absolute;color:#aeeaff;font-weight:900;font-size:17px;left:22px;top:12px;opacity:.8}.name{font-weight:800;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted);margin-top:5px}.fileicon{width:45px;height:52px;border:2px solid #aac0d4;border-radius:7px;display:grid;place-items:center;color:#1264a3;font-size:22px;flex:none;background:#f2f8fd}.download{display:inline-block;margin-top:10px;background:#0d5d9e;color:white;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px}.empty{grid-column:1/-1;background:white;border:1px dashed #bdccdc;border-radius:14px;padding:32px;text-align:center;color:var(--muted)}.admin{font-size:13px;background:#ffffff1a;border:1px solid #ffffff55;border-radius:9px;padding:8px 11px}.notice{margin-top:20px;color:var(--muted);font-size:12px}@media(max-width:600px){.wrap{margin:18px auto}.hero{padding:21px}.item{min-height:110px}}
</style></head><body>
<header><div class="head"><a class="brand" href="index.html">HOMS<span>TECH</span> <small style="font-size:12px;font-weight:600;color:#d9eaff">/ FIRMWARE LIBRARY</small></a><a class="admin" href="firmware-admin.html">Admin beheer</a></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">DOWNLOAD CENTER</div><h1>Firmware & Files</h1><p>Browse folders, find the file you need and download it. Every upload shows its date.</p></section>
<div class="toolbar"><div class="crumb" id="crumbs">All folders</div></div><section class="grid" id="grid"><div class="empty">Loading folders…</div></section><p class="notice">HOMS TECH Firmware Library · Use files only for devices and repairs you are authorized to service.</p></main>
<script>
const grid=document.getElementById('grid'),crumbs=document.getElementById('crumbs');let current=null,stack=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(v){try{return new Intl.DateTimeFormat('nl-NL',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}catch{return ''}}
function showCrumbs(){crumbs.innerHTML='<button onclick="goRoot()">Firmware</button>'+stack.map((x,i)=>' / <button onclick="goLevel('+i+')">'+esc(x.name)+'</button>').join('')}
async function load(){showCrumbs();grid.innerHTML='<div class="empty">Loading…</div>';try{const q=current?'?parentId='+encodeURIComponent(current):'';const r=await fetch('/api/firmware/items'+q);const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load');if(!d.items.length){grid.innerHTML='<div class="empty">This folder is empty for now.</div>';return}grid.innerHTML=d.items.map(x=>x.kind==='folder'?'<article class="item"><button class="folderbtn" onclick="openFolder('+x.id+',\''+esc(x.name).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')"><span class="foldericon"></span><span><span class="name">'+esc(x.name)+'</span><span class="sub">Folder</span></span></button></article>':'<article class="item"><div style="display:flex;gap:12px;align-items:center"><span class="fileicon">↓</span><span><span class="name">'+esc(x.name)+'</span><span class="sub">Added '+esc(date(x.created_at))+'</span><span class="sub">'+esc(x.description||'')+'</span></span></div><a class="download" href="'+esc(x.download_url||'#')+'" target="_blank" rel="noopener noreferrer">Download file ↓</a></article>').join('')}catch(e){grid.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function openFolder(id,name){stack.push({id,name});current=id;load()}function goRoot(){stack=[];current=null;load()}function goLevel(i){stack=stack.slice(0,i+1);current=stack[stack.length-1].id;load()}load();
</script></body></html>
