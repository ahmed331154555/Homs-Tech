<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn account - HOMS TECH</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7f8;color:#17212b}
    header{background:#111;color:#fff;padding:18px 20px}
    .nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .logo{font-size:24px;font-weight:800}
    nav a{color:#fff;text-decoration:none;margin-left:18px;font-size:14px}
    nav a:hover{opacity:.8}
    .wrap{max-width:1000px;margin:45px auto;padding:0 18px}
    h1{margin-bottom:8px}
    .sub{color:#66717a;margin-top:0;margin-bottom:28px}
    .card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .tabs{display:flex;gap:10px;margin-bottom:24px}
    .tab{border:0;border-radius:10px;padding:12px 20px;background:#e9eef1;cursor:pointer;font-weight:700}
    .tab.active{background:#19b85b;color:#fff}
    .form{display:none}
    .form.active{display:block}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
    input{width:100%;padding:13px 14px;border:1px solid #d5dce0;border-radius:10px;font-size:15px}
    .full{grid-column:1/-1}
    button.primary{margin-top:20px;background:#19b85b;color:#fff;border:0;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer}
    button.secondary{background:#e9eef1;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
    .message{display:none;padding:13px 15px;border-radius:10px;margin-bottom:18px}
    .message.error{display:block;background:#fde8e8;color:#a51d1d}
    .message.success{display:block;background:#e5f8eb;color:#137333}
    #accountBox{display:none}
    .info{background:#f7f9fa;border-radius:12px;padding:18px;margin:12px 0}
    .info p{margin:8px 0}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.nav{flex-direction:column;align-items:flex-start}nav a{margin:0 12px 0 0}}
  </style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">HOMS TECH</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="devices.html">Apparaten</a>
      <a href="prices.html">Prijzen</a>
      <a href="repair.html">Reparaties</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Mijn account</h1>
  <p class="sub">Maak een account aan om telefoons te bestellen en je bestellingen te bekijken.</p>

  <div id="message" class="message"></div>

  <section id="authBox" class="card">
    <div class="tabs">
      <button id="loginTab" class="tab active" type="button">Inloggen</button>
      <button id="registerTab" class="tab" type="button">Account maken</button>
    </div>

    <form id="loginForm" class="form active">
      <div class="grid">
        <div class="full">
          <label for="loginEmail">E-mailadres</label>
          <input id="loginEmail" type="email" autocomplete="email" required>
        </div>
        <div class="full">
          <label for="loginPassword">Wachtwoord</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <button class="primary" type="submit">Inloggen</button>
    </form>

    <form id="registerForm" class="form">
      <div class="grid">
        <div>
          <label for="registerName">Naam</label>
          <input id="registerName" type="text" autocomplete="name" required>
        </div>
        <div>
          <label for="registerEmail">E-mailadres</label>
          <input id="registerEmail" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="registerPhone">Telefoon</label>
          <input id="registerPhone" type="tel" autocomplete="tel">
        </div>
        <div>
          <label for="registerAddress">Adres</label>
          <input id="registerAddress" type="text" autocomplete="street-address">
        </div>
        <div class="full">
          <label for="registerPassword">Wachtwoord (minimaal 8 tekens)</label>
          <input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
      </div>
      <button class="primary" type="submit">Account maken</button>
    </form>
  </section>

  <section id="accountBox" class="card">
    <h2>Welkom, <span id="customerName"></span>!</h2>
    <div class="info">
      <p><strong>E-mail:</strong> <span id="customerEmail"></span></p>
      <p><strong>Telefoon:</strong> <span id="customerPhone"></span></p>
      <p><strong>Adres:</strong> <span id="customerAddress"></span></p>
    </div>
    <a href="devices.html"><button class="primary" type="button">Telefoons bekijken</button></a>
    <button id="logoutButton" class="secondary" type="button">Uitloggen</button>
  </section>
</main>

<script>
  const messageBox = document.getElementById("message");
  const authBox = document.getElementById("authBox");
  const accountBox = document.getElementById("accountBox");
  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");

  function showMessage(text, type) {
    messageBox.textContent = text || "";
    messageBox.className = "message" + (text ? " " + type : "");
  }

  function showTab(tab) {
    const login = tab === "login";
    loginTab.classList.toggle("active", login);
    registerTab.classList.toggle("active", !login);
    loginForm.classList.toggle("active", login);
    registerForm.classList.toggle("active", !login);
    showMessage("", "");
  }

  function showCustomer(customer) {
    document.getElementById("customerName").textContent = customer.name || "";
    document.getElementById("customerEmail").textContent = customer.email || "";
    document.getElementById("customerPhone").textContent = customer.phone || "-";
    document.getElementById("customerAddress").textContent = customer.address || "-";
    authBox.style.display = "none";
    accountBox.style.display = "block";
  }

  loginTab.addEventListener("click", () => showTab("login"));
  registerTab.addEventListener("click", () => showTab("register"));

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    showMessage("", "");

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;

    try {
      const response = await fetch("/api/customer/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        credentials: "same-origin",
        body: JSON.stringify({email, password})
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "Inloggen mislukt.");
      }

      showCustomer(data.customer);
      showMessage("Je bent succesvol ingelogd.", "success");
    } catch (error) {
      showMessage(error.message, "error");
    }
  });

  registerForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    showMessage("", "");

    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value.trim().toLowerCase();
    const phone = document.getElementById("registerPhone").value.trim();
    const address = document.getElementById("registerAddress").value.trim();
    const password = document.getElementById("registerPassword").value;

    if (!name || !email || !password) {
      showMessage("Vul naam, e-mailadres en wachtwoord in.", "error");
      return;
    }

    if (password.length < 8) {
      showMessage("Het wachtwoord moet minimaal 8 tekens bevatten.", "error");
      return;
    }

    try {
      const response = await fetch("/api/customer/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        credentials: "same-origin",
        body: JSON.stringify({name, email, phone, address, password})
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "Account aanmaken mislukt.");
      }

      showCustomer(data.customer);
      showMessage("Account succesvol aangemaakt.", "success");
      registerForm.reset();
    } catch (error) {
      showMessage(error.message, "error");
    }
  });

  document.getElementById("logoutButton").addEventListener("click", async () => {
    try {
      await fetch("/api/customer/logout", {
        method: "POST",
        credentials: "same-origin"
      });
    } finally {
      accountBox.style.display = "none";
      authBox.style.display = "block";
      showTab("login");
      showMessage("Je bent uitgelogd.", "success");
    }
  });

  async function loadCurrentCustomer() {
    try {
      const response = await fetch("/api/customer/me", {
        credentials: "same-origin"
      });

      if (!response.ok) return;

      const data = await response.json();

      if (data.authenticated && data.customer) {
        showCustomer(data.customer);
      }
    } catch (error) {
      console.error(error);
    }
  }

  loadCurrentCustomer();
</script>

</body>
</html>
