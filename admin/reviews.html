<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviews beheren · HOMS TECH</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#172b43;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#071d2d;color:#fff;padding:20px max(18px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:850;letter-spacing:.04em}.brand span{color:#60a5fa}.wrap{max-width:1180px;margin:28px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:28px}.muted{color:#64748b}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.stat,.panel,.review{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px}.stat strong{display:block;font-size:26px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar button,.action{border:1px solid #d5dfeb;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:650;color:#20354b}.toolbar button.active,.primary{background:#2563eb;color:white;border-color:#2563eb}.list{display:grid;gap:12px}.review-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stars{color:#e7a817;letter-spacing:2px;font-size:18px}.meta{font-size:13px;color:#64748b;margin:6px 0}.review h3{margin:8px 0}.review p{line-height:1.6;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.reply{display:flex;gap:8px;margin-top:12px}.reply input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:9px;padding:10px}.danger{color:#a12d36}.status{padding:10px 12px;border-radius:9px;background:#eaf2ff;color:#174b85;margin:12px 0}.empty{padding:30px;text-align:center;color:#64748b}.btn{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}@media(max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.review-head{display:block}.reply{display:grid}}
</style>
</head>
<body>
<header class="top"><div class="brand">HOMS <span>TECH</span> · REVIEWS</div><a class="btn" href="/admin">Terug naar admin</a></header>
<main class="wrap">
<div class="head"><div><h1>Reviews & beoordelingen</h1><p class="muted">Beheer klantbeoordelingen en reageer namens HOMS TECH.</p></div><button class="btn" onclick="loadReviews()">↻ Vernieuwen</button></div>
<div id="status" class="status" role="status" hidden></div>
<section class="stats">
<div class="stat"><span class="muted">Gemiddelde score</span><strong id="average">—</strong><small class="muted">Gepubliceerde reviews</small></div>
<div class="stat"><span class="muted">Gepubliceerd</span><strong id="published">0</strong><small class="muted">Zichtbaar op website</small></div>
<div class="stat"><span class="muted">Te beoordelen</span><strong id="pending">0</strong><small class="muted">Vooral 1- en 2-sterren</small></div>
<div class="stat"><span class="muted">Verborgen / afgewezen</span><strong id="hidden">0</strong><small class="muted">Niet openbaar zichtbaar</small></div>
</section>
<div class="toolbar" id="filters">
<button class="active" data-status="all">Alle</button><button data-status="pending_review">Te beoordelen</button><button data-status="published">Gepubliceerd</button><button data-status="hidden">Verborgen</button><button data-status="rejected">Afgewezen</button>
</div>
<section id="reviews" class="list"><div class="panel empty">Beoordelingen laden…</div></section>
</main>
<script>
let allReviews=[],activeStatus="all";
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function message(text){$("status").hidden=false;$("status").textContent=text;}
async function api(url,options={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||"Er ging iets mis.");return data;}
async function loadReviews(){try{const data=await api("/api/admin/reviews");allReviews=data.reviews||[];const counts=Object.fromEntries((data.counts||[]).map(x=>[x.status,Number(x.count)]));$("published").textContent=counts.published||0;$("pending").textContent=counts.pending_review||0;$("hidden").textContent=(counts.hidden||0)+(counts.rejected||0);const published=allReviews.filter(x=>x.status==="published");const avg=published.length?published.reduce((s,x)=>s+Number(x.rating),0)/published.length:0;$("average").textContent=published.length?avg.toFixed(1)+"/5":"—";render();}catch(e){message(e.message);$("reviews").innerHTML='<div class="panel empty">Geen toegang of de beoordelingen konden niet worden geladen. Log in als beheerder en probeer opnieuw.</div>';}}
function render(){const rows=allReviews.filter(x=>activeStatus==="all"||x.status===activeStatus);$("reviews").innerHTML=rows.length?rows.map(x=>'<article class="review"><div class="review-head"><div><div class="stars">'+("★".repeat(x.rating))+("☆".repeat(5-x.rating))+'</div><h3>'+esc(x.title||"Klantbeoordeling")+'</h3><div class="meta">'+esc(x.customer_name)+' · '+esc(x.order_type)+' #'+esc(x.order_id)+' · '+new Date(x.submitted_at).toLocaleString("nl-NL")+'</div></div><strong>'+esc(x.status)+'</strong></div><p>'+esc(x.body)+'</p><div class="meta">'+esc(x.customer_email)+'</div>'+(x.admin_reply?'<div class="panel"><strong>Reactie HOMS TECH</strong><p>'+esc(x.admin_reply)+'</p></div>':'')+'<div class="actions">'+(x.status==="pending_review"?'<button class="action primary" onclick="act('+x.id+',\'publish\')">Publiceren</button><button class="action danger" onclick="act('+x.id+',\'reject\')">Afwijzen</button>':'')+(x.status==="published"?'<button class="action" onclick="act('+x.id+',\'hide\')">Verbergen</button>':'')+'</div>'+(x.status==="published"?'<form class="reply" onsubmit="reply(event,'+x.id+')"><input maxlength="2000" placeholder="Antwoord namens HOMS TECH" value="'+esc(x.admin_reply||"")+'"><button class="action primary">Antwoorden</button></form>':'')+'</article>').join(""):'<div class="panel empty">Geen beoordelingen in deze categorie.</div>';}
async function act(id,action){try{await api("/api/admin/reviews/"+id,{method:"PUT",body:JSON.stringify({action})});message("Beoordeling bijgewerkt.");await loadReviews();}catch(e){message(e.message);}}
async function reply(event,id){event.preventDefault();const value=event.target.querySelector("input").value;try{await api("/api/admin/reviews/"+id,{method:"PUT",body:JSON.stringify({action:"reply",reply:value})});message("Uw reactie is opgeslagen.");await loadReviews();}catch(e){message(e.message);}}
$("filters").addEventListener("click",e=>{const b=e.target.closest("button[data-status]");if(!b)return;activeStatus=b.dataset.status;document.querySelectorAll("[data-status]").forEach(x=>x.classList.toggle("active",x===b));render();});
loadReviews();
</script>
</body></html>
