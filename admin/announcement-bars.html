<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcement bars | HOMS TECH Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font:14px Arial,sans-serif}.top{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.wrap{max-width:1120px;margin:26px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}h1{font-size:25px;margin:0 0 7px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-weight:700;color:#334155}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:#fff;color:#172033}.field textarea{min-height:112px;resize:vertical}.color-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.color-row input[type=color]{height:42px;padding:4px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e8eef6;color:#172033}.preview{overflow:hidden;border-radius:9px;min-height:44px;display:flex;align-items:center}.preview-track{display:flex;align-items:center;white-space:nowrap;width:max-content;gap:36px}.preview-item{font-weight:800}.status{margin-top:12px;font-weight:700}.switch{display:flex;align-items:center;gap:9px}.switch input{width:18px;height:18px}@media(max-width:720px){.grid,.color-row{grid-template-columns:1fr}.panel{padding:16px}.wrap{margin:16px auto}}
</style></head><body>
<header class="top"><strong>HOMS TECH — Announcement Bars</strong><a href="/admin/">← Terug naar dashboard</a></header>
<main class="wrap">
<section class="panel"><h1>Announcement Bar Manager</h1><p class="muted">Beheer de bovenste berichtenbalk per pagina. Wijzigingen worden alleen op de gekozen pagina opgeslagen.</p>
<div class="grid"><div class="field"><label for="page">Pagina</label><select id="page">
<option value="home">Homepage</option><option value="about">Over ons</option><option value="devices">Apparaten</option><option value="product">Productdetail</option><option value="repair">Reparaties</option><option value="sell">Uw toestel verkopen</option><option value="prices">Prijzen</option><option value="shop">Shop</option><option value="account">Account</option><option value="cart">Winkelwagen</option><option value="checkout">Afrekenen</option><option value="contact">Contact</option><option value="payment">Betaling</option><option value="privacy">Privacy</option><option value="design">Design preview</option>
</select></div><div class="field"><label>Status</label><label class="switch"><input id="enabled" type="checkbox" checked> Deze balk tonen op deze pagina</label></div></div></section>
<section class="panel"><div class="field"><label for="messages">Berichten (één per regel, maximaal 8)</label><textarea id="messages" placeholder="1 jaar garantie&#10;Snel geleverd&#10;Betrouwbare service&#10;Betaalbare prijzen"></textarea></div></section>
<section class="panel"><div class="color-row"><div class="field"><label for="background">Achtergrondkleur</label><input id="background" type="color" value="#071d2d"></div><div class="field"><label for="textColor">Tekstkleur</label><input id="textColor" type="color" value="#eaf4ff"></div><div class="field"><label for="accentColor">Accentkleur</label><input id="accentColor" type="color" value="#60a5fa"></div></div></section>
<section class="panel"><div class="grid">
<div class="field"><label for="speed">Snelheid: <span id="speedValue">140</span> px/sec</label><input id="speed" type="range" min="20" max="600" step="10" value="140"></div>
<div class="field"><label for="direction">Beweegrichting</label><select id="direction"><option value="rtl">Rechts naar links</option><option value="ltr">Links naar rechts</option></select></div>
<div class="field"><label for="mode">Weergave</label><select id="mode"><option value="scroll">Bewegend</option><option value="static">Statisch</option></select></div>
<div class="field"><label for="height">Hoogte: <span id="heightValue">42</span> px</label><input id="height" type="range" min="30" max="64" value="42"></div>
<div class="field"><label for="fontSize">Tekstgrootte: <span id="fontSizeValue">14</span> px</label><input id="fontSize" type="range" min="10" max="22" value="14"></div>
</div><div class="actions"><button class="btn secondary" id="previewBtn" type="button">Voorbeeld bijwerken</button><button class="btn primary" id="saveBtn" type="button">Instellingen opslaan</button></div><div class="status" id="status" role="status"></div></section>
<section class="panel"><strong>Live voorbeeld</strong><p class="muted">Dit voorbeeld toont de kleuren, tekst en bewegingssnelheid.</p><div id="preview" class="preview"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const defaults={enabled:true,messages:["1 jaar garantie","Snel geleverd","Betrouwbare service","Betaalbare prijzen"],background:"#071d2d",textColor:"#eaf4ff",accentColor:"#60a5fa",speed:140,direction:"rtl",mode:"scroll",height:42,fontSize:14};
let allBars={};
function clean(v){return {...defaults,...(v&&typeof v==="object"?v:{})}}
function selected(){return clean(allBars[$("page").value])}
function showStatus(t,ok=false){$("status").textContent=t;$("status").style.color=ok?"#078451":"#b45309"}
function fill(v){$("enabled").checked=v.enabled!==false;$("messages").value=(Array.isArray(v.messages)?v.messages:[]).join("\n");["background","textColor","accentColor","direction","mode","speed","height","fontSize"].forEach(k=>$(k).value=v[k]??defaults[k]);syncLabels();renderPreview()}
function syncLabels(){$("speedValue").textContent=$("speed").value;$("heightValue").textContent=$("height").value;$("fontSizeValue").textContent=$("fontSize").value}
function current(){return {enabled:$("enabled").checked,messages:$("messages").value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,8),background:$("background").value,textColor:$("textColor").value,accentColor:$("accentColor").value,speed:Number($("speed").value),direction:$("direction").value,mode:$("mode").value,height:Number($("height").value),fontSize:Number($("fontSize").value)}}
function renderPreview(){const c=current(),box=$("preview");box.innerHTML="";box.style.background=c.background;box.style.color=c.textColor;box.style.height=c.height+"px";const track=document.createElement("div");track.className="preview-track";const list=c.messages.length?c.messages:["Voorbeeld van uw bericht"];const copies=c.mode==="scroll"?2:1;for(let j=0;j<copies;j++)for(const m of list){const span=document.createElement("span");span.className="preview-item";span.style.fontSize=c.fontSize+"px";span.innerHTML='<span style="color:'+c.accentColor+'">✓</span> '+m;track.appendChild(span)}box.appendChild(track);if(c.mode==="scroll"&&matchMedia("(prefers-reduced-motion: no-preference)").matches){const w=track.scrollWidth/2;const duration=Math.max(3,w/Math.max(20,c.speed));track.animate(c.direction==="rtl"?[{transform:"translateX(0)"},{transform:"translateX(-50%)"}]:[{transform:"translateX(-50%)"},{transform:"translateX(0)"}],{duration:duration*1000,iterations:Infinity,easing:"linear"})}else{track.style.width="100%";track.style.justifyContent="center";track.style.whiteSpace="normal";track.style.flexWrap="wrap"}}
async function load(){showStatus("Instellingen laden...");try{const r=await fetch("/api/admin/announcement-bars",{credentials:"same-origin",cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"Geen toegang tot de instellingen");allBars=d.bars||{};fill(selected());showStatus("Instellingen geladen",true)}catch(e){showStatus(e.message)}}
$("page").addEventListener("change",()=>fill(selected()));
["enabled","messages","background","textColor","accentColor","direction","mode","speed","height","fontSize"].forEach(id=>$(id).addEventListener("input",()=>{syncLabels();renderPreview()}));
$("previewBtn").addEventListener("click",renderPreview);
$("saveBtn").addEventListener("click",async()=>{const b=$("saveBtn");b.disabled=true;showStatus("Opslaan...");try{const page=$("page").value;const r=await fetch("/api/admin/announcement-bars/"+encodeURIComponent(page),{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(current())});const d=await r.json();if(!r.ok)throw Error(d.error||"Opslaan mislukt");allBars[page]=d.settings;fill(selected());showStatus("✓ Instellingen opgeslagen",true)}catch(e){showStatus(e.message)}finally{b.disabled=false}});
load();
</script></body></html>
