<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMS TECH Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#071b33;
  color:white;
  padding:22px;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  opacity:.8;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.card h2{
  margin-top:0;
  color:#071b33;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 6px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #d8dee8;
  border-radius:10px;
  font-size:15px;
  background:white;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 17px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

.save{
  background:#071b33;
  color:white;
  padding:14px 24px;
}

.add{
  background:#0b7cff;
  color:white;
  margin-top:15px;
}

.delete{
  background:#dc3545;
  color:white;
  margin-top:10px;
}

.remove-photo{
  background:#dc3545;
  color:white;
  margin-top:8px;
}

.item{
  border:1px solid #e0e5ec;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  background:#fafbfd;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.used-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.used-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:15px;
  color:#071b33;
}

.photo-box{
  border:2px dashed #ccd5e2;
  border-radius:14px;
  padding:12px;
  text-align:center;
  background:#f8fafc;
  margin-top:10px;
}

.photo-preview{
  width:100%;
  max-width:280px;
  max-height:280px;
  object-fit:contain;
  border-radius:12px;
  display:block;
  margin:0 auto 10px;
}

.photo-empty{
  padding:30px 10px;
  color:#7b8798;
}

.file-input{
  width:100%;
  margin-top:10px;
}

.small-note{
  font-size:13px;
  color:#6d7785;
  margin-top:7px;
}

.blue{
  color:#0b7cff;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
}

.status.ok{
  display:block;
  background:#e8f7ee;
  color:#176b3a;
}

.status.error{
  display:block;
  background:#fdeaea;
  color:#a51d1d;
}

@media(max-width:700px){
  .grid,
  .used-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>HOMS TECH – Admin</h1>
  <p>Beheer je website, diensten, prijzen en gebruikte telefoons.</p>
</header>

<div class="container">

  <!-- ALGEMENE INFO -->
  <div class="card">
    <h2>Algemene informatie</h2>

    <label>Bedrijfsnaam</label>
    <input data-field="businessName">

    <label>Slogan</label>
    <input data-field="tagline">

    <label>Hoofdtitel</label>
    <input data-field="heroTitle">

    <label>Beschrijving</label>
    <textarea data-field="heroText"></textarea>

    <label>WhatsApp</label>
    <input data-field="whatsapp">

    <label>Telefoon</label>
    <input data-field="phone">

    <label>Werkgebied</label>
    <input data-field="areas">
  </div>


  <!-- DIENSTEN -->
  <div class="card">
    <h2>Diensten</h2>

    <div id="services"></div>

    <button class="add" onclick="addService()">+ Dienst toevoegen</button>
  </div>


  <!-- TELEFOONS EN PRIJZEN -->
  <div class="card">
    <h2>Telefoons & prijzen</h2>

    <div id="phones"></div>

    <button class="add" onclick="addPhone()">+ Telefoon toevoegen</button>
  </div>


  <!-- GEBRUIKTE TELEFOONS -->
  <div class="card">
    <h2>Gebruikte telefoons</h2>

    <div id="usedPhones"></div>

    <button class="add" onclick="addUsedPhone()">
      + Gebruikte telefoon toevoegen
    </button>
  </div>


  <!-- WAAROM ONS -->
  <div class="card">
    <h2>Waarom HOMS TECH?</h2>

    <div id="why"></div>

    <button class="add" onclick="addWhy()">+ Voordeel toevoegen</button>
  </div>


  <div class="card">
    <button class="save" onclick="save()">💾 Wijzigingen opslaan</button>

    <div id="status" class="status"></div>
  </div>

</div>


<script>

let data = {};


/* =========================
   DATA LADEN
========================= */

async function load(){

  try{

    const response = await fetch("/api/site");

    if(!response.ok){
      throw new Error("Kan websitegegevens niet laden.");
    }

    data = await response.json();

    if(!Array.isArray(data.services)){
      data.services = [];
    }

    if(!Array.isArray(data.phones)){
      data.phones = [];
    }

    if(!Array.isArray(data.usedPhones)){
      data.usedPhones = [];
    }

    if(!Array.isArray(data.why)){
      data.why = [];
    }

    normalizeData();

    render();

  }catch(error){

    showStatus(error.message,"error");

  }

}


/* =========================
   DATA NORMALISEREN
========================= */

function normalizeData(){

  data.services = data.services.map(function(x){

    if(Array.isArray(x)){
      return [
        x[0] || "🔧",
        x[1] || "",
        x[2] || ""
      ];
    }

    return [
      "🔧",
      String(x || ""),
      ""
    ];

  });


  data.why = data.why.map(function(x){

    if(Array.isArray(x)){
      return [
        x[0] || "✓",
        x[1] || "",
        x[2] || ""
      ];
    }

    return [
      "✓",
      String(x || ""),
      ""
    ];

  });


  data.usedPhones = data.usedPhones.map(function(x){

    return {
      name: x.name || "",
      brand: x.brand || "",
      price: x.price || "",
      condition: x.condition || "Goed",
      storage: x.storage || "",
      ram: x.ram || "",
      description: x.description || "",
      image: x.image || "",
      whatsapp: x.whatsapp || ""
    };

  });

}


/* =========================
   RENDER
========================= */

function render(){

  document.querySelectorAll("[data-field]").forEach(function(el){

    const key = el.dataset.field;

    el.value = data[key] || "";

  });


  renderServices();
  renderPhones();
  renderUsedPhones();
  renderWhy();

}


/* =========================
   DIENSTEN
========================= */

function renderServices(){

  const box = document.getElementById("services");

  box.innerHTML = "";

  data.services.forEach(function(x,i){

    box.innerHTML += `

      <div class="item">

        <label>Icoon</label>
        <input
          value="${esc(x[0])}"
          onchange="data.services[${i}][0]=this.value"
        >

        <label>Naam dienst</label>
        <input
          value="${esc(x[1])}"
          onchange="data.services[${i}][1]=this.value"
        >

        <label>Beschrijving</label>
        <textarea
          onchange="data.services[${i}][2]=this.value"
        >${esc(x[2])}</textarea>

        <button
          class="delete"
          onclick="deleteService(${i})"
        >
          Verwijderen
        </button>

      </div>

    `;

  });

}


function addService(){

  data.services.push([
    "🔧",
    "Nieuwe dienst",
    ""
  ]);

  renderServices();

}


function deleteService(i){

  data.services.splice(i,1);

  renderServices();

}


/* =========================
   TELEFOONS & PRIJZEN
========================= */

function renderPhones(){

  const box = document.getElementById("phones");

  box.innerHTML = "";

  data.phones.forEach(function(p,i){

    if(typeof p === "string"){

      p = {
        name:p,
        brand:"",
        screen:"",
        software:"",
        hardware:"",
        camera:""
      };

      data.phones[i] = p;

    }

    box.innerHTML += `

      <div class="item">

        <label>Model</label>
        <input
          value="${esc(p.name)}"
          onchange="data.phones[${i}].name=this.value"
        >

        <div class="grid">

          <div>
            <label>Merk</label>
            <input
              value="${esc(p.brand)}"
              onchange="data.phones[${i}].brand=this.value"
            >
          </div>

          <div>
            <label>Scherm prijs</label>
            <input
              value="${esc(p.screen)}"
              onchange="data.phones[${i}].screen=this.value"
            >
          </div>

          <div>
            <label>Software prijs</label>
            <input
              value="${esc(p.software)}"
              onchange="data.phones[${i}].software=this.value"
            >
          </div>

          <div>
            <label>Hardware prijs</label>
            <input
              value="${esc(p.hardware)}"
              onchange="data.phones[${i}].hardware=this.value"
            >
          </div>

          <div>
            <label>Camera prijs</label>
            <input
              value="${esc(p.camera)}"
              onchange="data.phones[${i}].camera=this.value"
            >
          </div>

        </div>

        <button
          class="delete"
          onclick="deletePhone(${i})"
        >
          Verwijderen
        </button>

      </div>

    `;

  });

}


function addPhone(){

  data.phones.push({
    name:"Nieuwe telefoon",
    brand:"",
    screen:"",
    software:"",
    hardware:"",
    camera:""
  });

  renderPhones();

}


function deletePhone(i){

  data.phones.splice(i,1);

  renderPhones();

}


/* =========================
   GEBRUIKTE TELEFOONS
========================= */

function renderUsedPhones(){

  const box = document.getElementById("usedPhones");

  box.innerHTML = "";

  data.usedPhones.forEach(function(p,i){

    box.innerHTML += `

      <div class="item">

        <div class="used-title">
          ${esc(p.name || "Nieuwe telefoon")}
        </div>

        <div class="used-grid">

          <div>

            <label>Model</label>

            <input
              value="${esc(p.name)}"
              data-u="${i}-name"
              onchange="syncUsed(${i},'name',this.value)"
            >

          </div>


          <div>

            <label>Merk</label>

            <input
              value="${esc(p.brand)}"
              data-u="${i}-brand"
              onchange="syncUsed(${i},'brand',this.value)"
            >

          </div>


          <div>

            <label>Prijs</label>

            <input
              value="${esc(p.price)}"
              data-u="${i}-price"
              placeholder="Bijv. €249"
              onchange="syncUsed(${i},'price',this.value)"
            >

          </div>


          <div>

            <label>Conditie</label>

            <select
              onchange="syncUsed(${i},'condition',this.value)"
            >

              <option value="Als nieuw"
                ${p.condition==="Als nieuw" ? "selected" : ""}>
                Als nieuw
              </option>

              <option value="Zeer goed"
                ${p.condition==="Zeer goed" ? "selected" : ""}>
                Zeer goed
              </option>

              <option value="Goed"
                ${p.condition==="Goed" ? "selected" : ""}>
                Goed
              </option>

              <option value="Gebruikt"
                ${p.condition==="Gebruikt" ? "selected" : ""}>
                Gebruikt
              </option>

            </select>

          </div>


          <div>

            <label>Opslag</label>

            <input
              value="${esc(p.storage)}"
              placeholder="Bijv. 128 GB"
              onchange="syncUsed(${i},'storage',this.value)"
            >

          </div>


          <div>

            <label>RAM</label>

            <input
              value="${esc(p.ram)}"
              placeholder="Bijv. 6 GB"
              onchange="syncUsed(${i},'ram',this.value)"
            >

          </div>

        </div>


        <!-- FOTO -->

        <label>Foto</label>

        <div class="photo-box">

          ${
            p.image
            ?
            `
              <img
                class="photo-preview"
                src="${esc(p.image)}"
                alt="Foto"
              >

              <button
                class="remove-photo"
                onclick="removeImage(${i})"
              >
                Foto verwijderen
              </button>
            `
            :
            `
              <div class="photo-empty">
                Nog geen foto gekozen
              </div>
            `
          }

          <input
            class="file-input"
            type="file"
            accept="image/*"
            onchange="chooseImage(${i},this)"
          >

          <div class="small-note">
            Kies één foto vanaf je telefoon of computer.
            De foto wordt automatisch verkleind.
          </div>

        </div>


        <label>WhatsApp voor dit toestel</label>

        <input
          value="${esc(p.whatsapp)}"
          placeholder="31612345678"
          onchange="syncUsed(${i},'whatsapp',cleanWhatsApp(this.value))"
        >


        <label>Beschrijving</label>

        <textarea
          onchange="syncUsed(${i},'description',this.value)"
        >${esc(p.description)}</textarea>


        <button
          class="delete"
          onclick="deleteUsedPhone(${i})"
        >
          Verwijderen
        </button>

      </div>

    `;

  });

}


/* =========================
   USED PHONE DATA
========================= */

function syncUsed(i,key,value){

  data.usedPhones[i][key] = value;

}


function addUsedPhone(){

  data.usedPhones.push({

    name:"iPhone 13",

    brand:"Apple",

    price:"",

    condition:"Goed",

    storage:"128 GB",

    ram:"",

    description:"",

    image:"",

    whatsapp:""

  });

  renderUsedPhones();

}


function deleteUsedPhone(i){

  if(!confirm("Deze gebruikte telefoon verwijderen?")){
    return;
  }

  data.usedPhones.splice(i,1);

  renderUsedPhones();

}


/* =========================
   FOTO KIEZEN
========================= */

async function chooseImage(index,input){

  const file = input.files && input.files[0];

  if(!file){
    return;
  }

  try{

    showStatus("Foto wordt verwerkt...","ok");

    const compressed = await compressImage(file);

    data.usedPhones[index].image = compressed;

    renderUsedPhones();

    showStatus("Foto toegevoegd. Klik daarna op Wijzigingen opslaan.","ok");

  }catch(error){

    console.error(error);

    showStatus(
      "Deze foto kan niet worden verwerkt. Kies JPG, PNG of WEBP.",
      "error"
    );

  }

}


/* =========================
   FOTO VERWIJDEREN
========================= */

function removeImage(index){

  data.usedPhones[index].image = "";

  renderUsedPhones();

}


/* =========================
   FOTO VERKLEINEN
========================= */

function compressImage(file){

  return new Promise(function(resolve,reject){

    const reader = new FileReader();

    reader.onload = function(){

      const img = new Image();

      img.onload = function(){

        let maxSide = 800;

        let width = img.width;
        let height = img.height;

        if(width > maxSide || height > maxSide){

          if(width > height){

            height = Math.round(height * maxSide / width);
            width = maxSide;

          }else{

            width = Math.round(width * maxSide / height);
            height = maxSide;

          }

        }


        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0,width,height);

        ctx.drawImage(img,0,0,width,height);


        const qualities = [
          0.70,
          0.60,
          0.50,
          0.42,
          0.35
        ];


        let result = "";

        for(const quality of qualities){

          result = canvas.toDataURL("image/jpeg",quality);

          if(result.length <= 260000){
            break;
          }

        }


        /* إذا بقيت الصورة كبيرة نصغرها أكثر */

        if(result.length > 260000){

          const smallCanvas = document.createElement("canvas");

          let smallWidth = width;
          let smallHeight = height;

          const smallMax = 650;

          if(smallWidth > smallMax || smallHeight > smallMax){

            if(smallWidth > smallHeight){

              smallHeight = Math.round(
                smallHeight * smallMax / smallWidth
              );

              smallWidth = smallMax;

            }else{

              smallWidth = Math.round(
                smallWidth * smallMax / smallHeight
              );

              smallHeight = smallMax;

            }

          }

          smallCanvas.width = smallWidth;
          smallCanvas.height = smallHeight;

          const smallCtx = smallCanvas.getContext("2d");

          smallCtx.fillStyle = "#ffffff";
          smallCtx.fillRect(
            0,
            0,
            smallWidth,
            smallHeight
          );

          smallCtx.drawImage(
            img,
            0,
            0,
            smallWidth,
            smallHeight
          );

          result = smallCanvas.toDataURL(
            "image/jpeg",
            0.50
          );

        }


        resolve(result);

      };


      img.onerror = function(){

        reject(
          new Error("Image format not supported")
        );

      };


      img.src = reader.result;

    };


    reader.onerror = function(){

      reject(
        new Error("File could not be read")
      );

    };


    reader.readAsDataURL(file);

  });

}


/* =========================
   WHY
========================= */

function renderWhy(){

  const box = document.getElementById("why");

  box.innerHTML = "";

  data.why.forEach(function(x,i){

    box.innerHTML += `

      <div class="item">

        <label>Icoon</label>

        <input
          value="${esc(x[0])}"
          onchange="data.why[${i}][0]=this.value"
        >

        <label>Titel</label>

        <input
          value="${esc(x[1])}"
          onchange="data.why[${i}][1]=this.value"
        >

        <label>Beschrijving</label>

        <textarea
          onchange="data.why[${i}][2]=this.value"
        >${esc(x[2])}</textarea>

        <button
          class="delete"
          onclick="deleteWhy(${i})"
        >
          Verwijderen
        </button>

      </div>

    `;

  });

}


function addWhy(){

  data.why.push([
    "✓",
    "Nieuw voordeel",
    ""
  ]);

  renderWhy();

}


function deleteWhy(i){

  data.why.splice(i,1);

  renderWhy();

}


/* =========================
   WHATSAPP
========================= */

function cleanWhatsApp(value){

  return String(value || "")
    .replace(/[^\d+]/g,"");

}


/* =========================
   OPSLAAN
========================= */

async function save(){

  try{

    /* velden algemene info ophalen */

    document.querySelectorAll("[data-field]").forEach(function(el){

      data[el.dataset.field] = el.value;

    });


    /* WhatsApp opschonen */

    data.whatsapp = cleanWhatsApp(data.whatsapp);

    data.phone = cleanWhatsApp(data.phone);

    data.usedPhones.forEach(function(p){

      p.whatsapp = cleanWhatsApp(p.whatsapp);

    });


    /* Controle totale grootte */

    const payload = JSON.stringify(data);

    const maxPayload = 1800000;

    if(payload.length > maxPayload){

      showStatus(
        "De gegevens zijn te groot. Verwijder een paar grote foto's en probeer opnieuw.",
        "error"
      );

      return;

    }


    showStatus("Opslaan...","ok");


    const response = await fetch("/api/site",{

      method:"PUT",

      headers:{
        "Content-Type":"application/json"
      },

      credentials:"include",

      body:payload

    });


    const result = await response.json();


    if(!response.ok){

      throw new Error(
        result.error || "Opslaan mislukt."
      );

    }


    data = result.data || data;

    normalizeData();

    render();

    showStatus(
      "✓ Wijzigingen succesvol opgeslagen.",
      "ok"
    );


  }catch(error){

    console.error(error);

    showStatus(
      error.message || "Opslaan mislukt.",
      "error"
    );

  }

}


/* =========================
   STATUS
========================= */

function showStatus(message,type){

  const box = document.getElementById("status");

  box.textContent = message;

  box.className = "status " + type;

}


/* =========================
   HTML VEILIG MAKEN
========================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* START */

load();

</script>

</body>
</html>
